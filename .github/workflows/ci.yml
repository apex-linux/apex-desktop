# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

# No path filter: biometric data can arrive in any directory (the privacy job).
on:
  pull_request: {}
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rpm:
    name: make check-data, the RPM (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: Tools for checkout and the data checks
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core make libxml2 glib2 dconf inkscape librsvg2-tools adwaita-sans-fonts
          plymouth-plugin-script plymouth-plugin-two-step plymouth-devel
          xorg-x11-server-Xvfb xwd xdotool netpbm-progs cpio systemd vte-profile bash-color-prompt util-linux-script
          python3-gobject gtk4 adwaita-icon-theme gtk-update-icon-cache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make check-data
        # The Plymouth preview must run here, not skip: check-data skips what is not installed.
        run: |
          make check-data 2>&1 | tee /tmp/check-data.log
          test -s target/check-data/plymouth-frames/apex-scale1-splash.png
          grep -q '^tmpfiles-check.sh: ' /tmp/check-data.log
          grep -q '^places-check.py: .* resolve to Apex' /tmp/check-data.log
          grep -q '^gtk-update-icon-cache: the ten Apex icon caches' /tmp/check-data.log
          grep -q '^mimetypes-check.py: .* resolve to Apex' /tmp/check-data.log
          grep -q '^check-greeter.sh: ' /tmp/check-data.log
          grep -q '^gdm-logo-check.sh: ' /tmp/check-data.log
          grep -q '^disabled-features-check.sh: ' /tmp/check-data.log
          grep -q 'build-logo.sh .*apex-gdm-logo.svg' /tmp/check-data.log

      - name: The prompt under VTE's shell integration
        run: .github/scripts/prompt-vte-check.sh

      - name: rpms.sh build
        # The builder VM builds the RPM the same way; a spec error fails here, not there.
        run: |
          .github/scripts/rpms.sh build /tmp/rpms "$(.github/scripts/rpms.sh key)"
          rpm -qlp /tmp/rpms/apex-desktop-*.rpm
          rpm -qp --configfiles /tmp/rpms/apex-desktop-*.rpm
          mkdir /tmp/payload
          rpm2cpio /tmp/rpms/apex-desktop-*.rpm | (cd /tmp/payload && cpio -idm --quiet)
          bash desktop/plymouth/check-theme.sh /tmp/payload/usr/share/plymouth/themes
          python3 .github/scripts/places-check.py /tmp/payload/usr/share/icons
          python3 .github/scripts/mimetypes-check.py /tmp/payload/usr/share/icons

      - name: An accent theme without inode-directory fails places-check
        # Without it, St falls to Adwaita's inode-directory before it tries the accent folder.
        run: |
          cp -a /tmp/payload/usr/share/icons /tmp/no-inode
          rm /tmp/no-inode/*/icon-theme.cache /tmp/no-inode/Apex-red/*/mimetypes/inode-directory.svg
          if python3 .github/scripts/places-check.py /tmp/no-inode 2>/tmp/out; then exit 1; fi
          grep -F 'FAIL: Apex-red inode-directory at 64@1: ' /tmp/out

  icons:
    name: make check-icons, the symbolic icon scan (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: Tools for checkout and the check
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core make inkscape libxml2 python3-gobject gtk4 adwaita-icon-theme hicolor-icon-theme
          glib2-devel grep diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The scanned packages
        run: >-
          sed 's/#.*//' tools/icons/packages.txt | xargs
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install

      - name: make check-icons
        # After the apps: the icons they install in hicolor resolve, as in the image.
        run: make check-icons SYMBOLIC_FLAGS=--fallbacks

      - name: A name nothing draws fails the check
        run: |
          cp desktop/icons/expected-symbolic.txt /tmp/names
          printf 'apex-no-such-icon-symbolic\tci\n' >>/tmp/names
          if python3 .github/scripts/symbolic-check.py --unresolved tools/icons/unresolved.txt \
            /tmp/names target/check-data/icons >/tmp/out; then exit 1; fi
          grep -Fx "$(printf '  apex-no-such-icon-symbolic\tci')" /tmp/out

      - name: tools/icons/scan.sh matches expected-symbolic.txt
        # A Fedora update moves the list without any change here, so a drift warns instead of failing.
        run: |
          tools/icons/scan.sh tools/icons/packages.txt >/tmp/expected-symbolic.txt 2>/tmp/templates.txt
          sort -u /tmp/templates.txt
          if ! diff -u desktop/icons/expected-symbolic.txt /tmp/expected-symbolic.txt; then
            echo "::warning::desktop/icons/expected-symbolic.txt differs from a fresh scan; run tools/icons/scan.sh"
            cat /tmp/expected-symbolic.txt
            python3 .github/scripts/symbolic-check.py --fallbacks --unresolved tools/icons/unresolved.txt \
              /tmp/expected-symbolic.txt target/check-data/icons || true
          fi

  scripts:
    name: shellcheck, actionlint, selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/install-tool@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
        with:
          tools: actionlint shellcheck

      - name: actionlint
        run: actionlint -config-file .github/scripts/actionlint.yaml

      - name: bash -n and shellcheck
        run: |
          files=(.github/scripts/*.sh desktop/icons/*.sh desktop/plymouth/*.sh desktop/ptyxis/*.sh
            desktop/gdm/*.sh desktop/wallpapers/*.sh tools/icons/*.sh)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x -P .github/scripts --severity=style "${files[@]}"

      - name: Script self-tests
        run: .github/scripts/selftest.sh

  privacy:
    name: No biometric files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/privacy-guard@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main

  comments:
    name: Comment guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/comments@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
