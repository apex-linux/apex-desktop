# Flatpak apps read ~/.config/gtk-4.0/apex.css, which apex-session-agent writes.
# f never overwrites, so an admin's own global override stays as it is.
d /var/lib/flatpak/overrides 0755 root root -
f /var/lib/flatpak/overrides/global 0644 root root - [Context]\nfilesystems=xdg-config/gtk-4.0:ro;\n
