#
# The Apex crash guard (ADR 0014; ARCHITECTURE 7.4), shipped by apex-desktop. GNOME's own
# safety net covers extensions only, and the Apex layer is compiled into gnome-shell, so
# a failed shell also starts apex-shell-safe.service. OnFailure= is a list: this adds to
# upstream's org.gnome.Shell-disable-extensions.service and gnome-session-shutdown.target.
# Exit status 1 stays a success for this unit (upstream's SuccessExitStatus=1), so a JS
# error in the static import graph never trips the guard; G2 catches that case.
[Unit]
OnFailure=apex-shell-safe.service
